# Questions
qgis_plugin_name:
  type: str
  help: What is the human-readable full name of your QGIS plugin? This is used in documentation and license files.
  placeholder: My QGIS Plugin
  validator: "{% if not qgis_plugin_name %}Cannot be empty{% endif %}"

qgis_plugin_description:
  type: str
  help: What does your QGIS plugin do? Provide a short description for the plugin metadata and repository README.
  placeholder: Adds tools for editing spatial datasets.
  validator: "{% if not qgis_plugin_description %}Cannot be empty{% endif %}"

qgis_plugin_module:
  type: str
  help: What should be used as the plugin's Python module name (used as the plugin folder name in src folder) name?
  default: "{{ qgis_plugin_name | replace(' ', '_') | replace('-', '_') | lower }}"
  validator: "{% if not qgis_plugin_module %}Cannot be empty{% endif %}"

qgis_plugin_class:
  type: str
  help: What should be used as the plugin module's class name?
  default: >-
    {%- for word in qgis_plugin_name.replace('-', ' ').replace('_', ' ').split() -%}
    {{ word[0] | upper }}{{ word[1:] }}
    {%- endfor -%}
  validator: >-
    {% if not qgis_plugin_class %}Cannot be empty
    {%- elif not qgis_plugin_class[0].isupper() or not qgis_plugin_class.isalnum()
    %}Must be a CamelCase name containing only letters and digits and starting
    with an uppercase letter{% endif %}

is_monorepo_component:
  type: bool
  help: |
    Is the plugin a component of a monorepo (a uv workspace member)?
    Only the plugin component is generated, the repository root is left to the wider project.
  default: false

qgis_version:
  type: str
  help: What is the target QGIS version?
  default: QGIS3 & QGIS4
  choices:
    - QGIS3
    - QGIS3 & QGIS4

python_version:
  type: str
  help: Which python version is used?
  default: 3.12
  choices:
    - 3.12
    - 3.13
    - 3.14

plugin_metadata_author:
  type: str
  help: Who is the author of this plugin (written to metadata.txt)?

plugin_metadata_email:
  type: str
  help: What is the author's email address (written to metadata.txt)?

plugin_metadata_repository_url:
  type: str
  help: What is the URL of the plugin's source code repository (written to metadata.txt)?

github_workflows:
  type: bool
  help: Add GitHub Actions workflows for the plugin?
  default: "{{ not is_monorepo_component and 'github.com' in plugin_metadata_repository_url }}"
  when: "{{ not is_monorepo_component }}"

insert_copyright_header:
  type: bool
  help: Include copyright headers in generated source files?
  default: true

setup_translations:
  type: bool
  help: Enable translation support for the plugin?
  default: true

lang_key_for_translations:
  type: str
  help: What is the target language code for translations (for example, fi, de, or fr)?
  placeholder: fi
  when: "{{ setup_translations }}"
  validator: "{% if not lang_key_for_translations %}Cannot be empty{% endif %}"

# Computed values
copyright_year:
  type: str
  default: "{{ copyright_year | default('%Y' | strftime) }}"
  when: false

workspace_file_name:
  type: str
  default: "{{ qgis_plugin_module | replace('_', '-') | lower }}"
  when: false

_message_after_copy: |
  {%- if is_monorepo_component %}
  Add this directory to [tool.uv.workspace] members of the repository root.

  Later updates: `copier update` inside this directory.
  {%- endif %}

_subdirectory: template

_exclude:
  - |
    {%- if is_monorepo_component %}
    .editorconfig
    .gitlint
    *.code-workspace
    {%- endif %}

_skip_if_exists:
  - "*.ts"
  - LICENSE
  - copyright-header.txt
  - CHANGELOG.md
  - README.md
  - whitelist.txt
  - .env.example
  - "src/*/metadata.txt"
  - "src/*/plugin.py"
  - "test/test_plugin.py"

_min_copier_version: "9.10.0"
